<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque Profissional</title>

<style>
body { font-family: Arial; background:#0f172a; color:#fff; margin:0; }
header { padding:20px; text-align:center; background:#020617; }
.container { padding:20px; max-width:1000px; margin:auto; }

input, select { padding:10px; border-radius:6px; border:none; width:100%; margin-bottom:10px; }

.grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap:10px; }

.card { background:#1e293b; padding:15px; border-radius:10px; }
.card.low { border:2px solid #ef4444; }

.small { color:#94a3b8; font-size:0.9rem; }

.actions button { margin-top:5px; margin-right:5px; padding:6px 10px; border:none; border-radius:6px; cursor:pointer; }

.green { background:#22c55e; }
.red { background:#ef4444; }
.gray { background:#64748b; }

.form { background:#020617; padding:15px; border-radius:10px; margin-top:20px; }

.dashboard { display:flex; gap:10px; margin-bottom:20px; }
.box { flex:1; background:#1e293b; padding:10px; border-radius:8px; text-align:center; }
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="Reserva" style="height:70px; margin-bottom:10px; filter: drop-shadow(0 0 10px rgba(255,0,0,0.5));">
  <h2>Estoque Profissional</h2>
</header>

<div class="container">

<div class="dashboard">
  <div class="box">Total Peças<br><strong id="totalPecas">0</strong></div>
  <div class="box">Modelos<br><strong id="totalModelos">0</strong></div>
</div>

<div style="display:flex; gap:10px; margin-bottom:10px;">
  <input 
    id="busca" 
    placeholder="Buscar modelo..." 
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    style="flex:1;"
  >
  <button onclick="render()" style="padding:10px; border:none; border-radius:6px; cursor:pointer; background:#22c55e;">Buscar</button>
</div>

<select id="ordenar" onchange="render()">
  <option value="">Ordenar</option>
  <option value="maior">Maior quantidade</option>
  <option value="menor">Menor quantidade</option>
</select>

<div class="grid" id="lista"></div>

<div class="form">
  <h3>Adicionar Produto</h3>
  <input id="nome" placeholder="Nome">
  <input id="ref" placeholder="Referência">
  <input id="qtd" type="number" placeholder="Quantidade">
  <button onclick="add()">Salvar</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAs95QRYT1xn-y3IFofADp-nOhYnPIbCgU",
  authDomain: "estoque-reserva.firebaseapp.com",
  projectId: "estoque-reserva",
  storageBucket: "estoque-reserva.firebasestorage.app",
  messagingSenderId: "49971813697",
  appId: "1:49971813697:web:7a667a5ab86d63293d95c0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let dados = [];

async function carregar() {
  const snap = await getDocs(collection(db, "estoque"));
  dados = [];
  snap.forEach(docSnap => dados.push({ ...docSnap.data(), id: docSnap.id }));
  render();
}

function agrupar() {
  const mapa = {};

  dados.forEach(i => {
    const key = i.nome + i.ref;

    if (!mapa[key]) {
      mapa[key] = { ...i, quantidade: 0, ids: [] };
    }

    mapa[key].quantidade += Number(i.quantidade);
    mapa[key].ids.push(i.id);
  });

  return Object.values(mapa);
}

function normalizar(txt) {
  if (!txt) return "";

  return txt
    .toString()
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "");
}

window.render = function render() {
  const lista = document.getElementById("lista");
  const buscaInput = document.getElementById("busca").value || "";
  const busca = normalizar(buscaInput);
  const ordenar = document.getElementById("ordenar").value;

  lista.innerHTML = "";

  let agrupados = agrupar();

  // 🔍 filtro
  agrupados = agrupados.filter(item => {
    const nome = normalizar(item.nome);
    const ref = normalizar(item.ref);
    const buscaTexto = normalizar(busca);

    return nome.includes(buscaTexto) || ref.includes(buscaTexto);
  });

  // 📊 ordenação
  if (ordenar === "maior") {
    agrupados.sort((a,b)=>b.quantidade-a.quantidade);
  }
  if (ordenar === "menor") {
    agrupados.sort((a,b)=>a.quantidade-b.quantidade);
  }

  let totalPecas = 0;

  agrupados.forEach(item => {
    totalPecas += item.quantidade;

    const div = document.createElement("div");
    div.className = "card";

    // 📉 destaque estoque baixo
    if (item.quantidade <= 2) {
      div.classList.add("low");
    }

    div.innerHTML = `
      <h4>${item.nome}</h4>
      <div class="small">Ref: ${item.ref}</div>
      <div>Qtd: ${item.quantidade}</div>
      <div class="actions">
        <button class="green" onclick="alterar('${item.nome}','${item.ref}',1)">+</button>
        <button class="red" onclick="alterar('${item.nome}','${item.ref}',-1)">-</button>
        <button class="gray" onclick='remover(${JSON.stringify(item.ids)})'>🗑️</button>
      </div>
    `;

    lista.appendChild(div);
  });

  document.getElementById("totalPecas").innerText = totalPecas;
  document.getElementById("totalModelos").innerText = agrupados.length;
}

window.alterar = async (nome, ref, qtd) => {
  await addDoc(collection(db, "estoque"), { nome, ref, quantidade: qtd });
  carregar();
}

window.remover = async (ids) => {
  const confirmar = confirm("Deseja remover totalmente esse modelo do estoque?");
  if (!confirmar) return;

  const promises = ids.map(id => deleteDoc(doc(db, "estoque", id)));
  await Promise.all(promises);

  carregar();
}

window.add = async () => {
  const nome = document.getElementById("nome").value;
  const ref = document.getElementById("ref").value;
  const qtd = document.getElementById("qtd").value;

  if (!nome || !ref || !qtd) return alert("Preencha tudo");

  await addDoc(collection(db, "estoque"), {
    nome,
    ref,
    quantidade: Number(qtd)
  });

  carregar();
}

carregar();
</script>

<footer style="text-align:center; padding:20px; color:#94a3b8; font-size:0.9rem;">
Projeto criado por Eduardo Henrique Cunha Benevides
</footer>

</body>
</html>
